name: Build & deploy

on:
  push:
    branches: [main]
  pull_request:
  # RisuAI 원본이 바뀌면 CBS 레퍼런스도 따라가도록 매일 한 번 다시 빌드한다.
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # 페이지의 '마지막 수정' 날짜를 git 기록에서 읽으므로 전체 기록이 필요하다.
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build (CBS 레퍼런스 생성 포함)
        run: pnpm build

      - name: Check internal links
        run: pnpm check:links

      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
